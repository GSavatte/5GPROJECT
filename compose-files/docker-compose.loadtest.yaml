services:
  db-seeder:
    image: mongo:latest
    container_name: db-seeder
    volumes:
      - ../utils/load_test:/config
    command: mongosh "mongodb://db.open5gs.org/open5gs" /config/seed.js
    networks:
      - open5gs

  ue-loadtester:
    image: "ghcr.io/borjis131/ue:v3.2.7"
    container_name: ue-loadtester
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 65536
    depends_on:
      db-seeder:
        condition: service_completed_successfully
    volumes:
      - ../utils/load_test:/config
    entrypoint: ["/bin/bash", "/config/start_load_test.sh"]
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    networks:
      - open5gs

  internet-sim:
    image: nginx:alpine
    container_name: internet-sim
    restart: unless-stopped
    networks:
      - open5gs
    volumes:
      - ../utils/load_test:/usr/share/nginx/html

networks:
  open5gs:
    external: true