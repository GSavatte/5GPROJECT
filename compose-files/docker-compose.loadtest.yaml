services:
  
  ue-loadtester:
    image: "ghcr.io/borjis131/ue:v3.2.7"
    container_name: ue-loadtester
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 65536
    volumes:
      - ../utils/load_test:/config
      - ../config-files/generated_gnbs:/generated_gnbs
    entrypoint: ["/bin/bash", "/config/start_load_test.sh"]
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    networks:
      - open5gs

  internet-sim:
    image: nginx:alpine
    container_name: internet-sim
    restart: unless-stopped
    networks:
      - open5gs
    volumes:
      - ../utils/load_test:/usr/share/nginx/html

networks:
  open5gs:
    external: true