# Dev version
  webui:
    container_name: webui
    build:
      context: ..
      dockerfile: ./images/webui/Dockerfile
      target: dev
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION}
        - NODE_VERSION=${NODE_VERSION}
    environment:
      - DB_URI=mongodb://db.open5gs.org/open5gs
      - PORT=9999
      - HOSTNAME=0.0.0.0
      - NODE_ENV=dev
    user: root
    volumes:
      - ../webui:/usr/local/src/webui
      - ../shared_flags:/shared_flags
    entrypoint: ["npm"]
    command: ["run", "dev"]
    networks:
      open5gs:
        aliases:
          - webui.open5gs.org
    depends_on:
      - db
    ports:
      - "9999:9999/tcp"

networks:
  open5gs:
    name: open5gs
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-ogs
    ipam:
      config:
        - subnet: 10.33.0.0/16

volumes:
  db_data:
    name: open5gs_db_data_project
    labels:
      org.open5gs.mongodb_version: ${MONGODB_VERSION}
  db_config:
    name: open5gs_db_config_project
    labels:
      org.open5gs.mongodb_version: ${MONGODB_VERSION}

configs:
  nrf_config:
    file: ../config-files/core/nrf.yaml
  ausf_config:
    file: ../config-files/core/ausf.yaml
  udm_config:
    file: ../config-files/core/udm.yaml
  udr_config:
    file: ../config-files/core/udr.yaml
  nssf_config:
    file: ../config-files/core/nssf.yaml
  bsf_config:
    file: ../config-files/core/bsf.yaml
  pcf_config:
    file: ../config-files/core/pcf.yaml
  amf_config:
    file: ../config-files/core/amf.yaml
  smf1_config:
    file: ../config-files/core/smf1.yaml
  smf2_config:
    file: ../config-files/core/smf2.yaml
  smf3_config:
    file: ../config-files/core/smf3.yaml
  upf1_config:
    file: ../config-files/core/upf1.yaml
  upf2_config:
    file: ../config-files/core/upf2.yaml
  upf3_config:
    file: ../config-files/core/upf3.yaml