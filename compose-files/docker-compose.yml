services:
  db:
    container_name: db
    image: "mongo:${MONGODB_VERSION}"
    command: "mongod --bind_ip 0.0.0.0 --port 27017"
    networks:
      open5gs:
        aliases:
          - db.open5gs.org
    volumes:
      - db_data:/data/db
      - db_config:/data/configdb
    ports:
      - "0.0.0.0:27017:27017/tcp"

  db-seeder:
    image: mongo:latest
    container_name: db-seeder
    volumes:
      - ../utils/load_test:/config
    command: mongosh "mongodb://db.open5gs.org/open5gs" /config/seed.js
    networks:
      - open5gs

  nrf:
    container_name: nrf
    image: "ghcr.io/borjis131/nrf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/nrf.yaml"
    networks:
      open5gs:
        aliases:
          - nrf.open5gs.org
    configs:
      - source: nrf_config
        target: /etc/open5gs/custom/nrf.yaml
    volumes:
      - ../logs:/var/log/open5gs

  ausf:
    container_name: ausf
    image: "ghcr.io/borjis131/ausf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/ausf.yaml"
    networks:
      open5gs:
        aliases:
          - ausf.open5gs.org
    configs:
      - source: ausf_config
        target: /etc/open5gs/custom/ausf.yaml
    depends_on:
      - nrf
    volumes:
      - ../logs:/var/log/open5gs

  udm:
    container_name: udm
    image: "ghcr.io/borjis131/udm:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/udm.yaml"
    networks:
      open5gs:
        aliases:
          - udm.open5gs.org
    configs:
      - source: udm_config
        target: /etc/open5gs/custom/udm.yaml
    depends_on:
      - nrf
    volumes:
      - ../logs:/var/log/open5gs

  udr:
    container_name: udr
    image: "ghcr.io/borjis131/udr:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/udr.yaml"
    restart: unless-stopped
    networks:
      open5gs:
        aliases:
          - udr.open5gs.org
    configs:
      - source: udr_config
        target: /etc/open5gs/custom/udr.yaml
    depends_on:
      - db
      - nrf
    volumes:
      - ../logs:/var/log/open5gs

  nssf:
    container_name: nssf
    image: "ghcr.io/borjis131/nssf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/nssf.yaml"
    networks:
      open5gs:
        aliases:
          - nssf.open5gs.org
    configs:
      - source: nssf_config
        target: /etc/open5gs/custom/nssf.yaml
    depends_on:
      - nrf
    volumes:
      - ../logs:/var/log/open5gs

  bsf:
    container_name: bsf
    image: "ghcr.io/borjis131/bsf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/bsf.yaml"
    networks:
      open5gs:
        aliases:
          - bsf.open5gs.org
    configs:
      - source: bsf_config
        target: /etc/open5gs/custom/bsf.yaml
    depends_on:
      - nrf
    volumes:
      - ../logs:/var/log/open5gs

  pcf:
    container_name: pcf
    image: "ghcr.io/borjis131/pcf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/pcf.yaml"
    restart: unless-stopped
    networks:
      open5gs:
        aliases:
          - pcf.open5gs.org
    configs:
      - source: pcf_config
        target: /etc/open5gs/custom/pcf.yaml
    depends_on:
      - db
      - nrf
    volumes:
      - ../logs:/var/log/open5gs

  amf:
    container_name: amf
    image: "ghcr.io/borjis131/amf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/amf.yaml"
    networks:
      open5gs:
        aliases:
          - amf.open5gs.org
    configs:
      - source: amf_config
        target: /etc/open5gs/custom/amf.yaml
    depends_on:
      - nrf
    volumes:
      - ../logs:/var/log/open5gs

  smf1:
    container_name: smf1
    image: "ghcr.io/borjis131/smf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/smf1.yaml"
    networks:
      open5gs:
        aliases:
          - smf1.open5gs.org
    configs:
      - source: smf1_config
        target: /etc/open5gs/custom/smf1.yaml
    depends_on:
      - nrf
      - upf1
    volumes:
      - ../logs:/var/log/open5gs

  smf2:
    container_name: smf2
    image: "ghcr.io/borjis131/smf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/smf2.yaml"
    networks:
      open5gs:
        aliases:
          - smf2.open5gs.org
    configs:
      - source: smf2_config
        target: /etc/open5gs/custom/smf2.yaml
    depends_on:
      - nrf
      - upf2
    volumes:
      - ../logs:/var/log/open5gs

  smf3:
    container_name: smf3
    image: "ghcr.io/borjis131/smf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/smf3.yaml"
    networks:
      open5gs:
        aliases:
          - smf3.open5gs.org
    configs:
      - source: smf3_config
        target: /etc/open5gs/custom/smf3.yaml
    depends_on:
      - nrf
      - upf3
    volumes:
      - ../logs:/var/log/open5gs

  upf1:
    container_name: upf1
    image: "ghcr.io/borjis131/upf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/upf1.yaml"
    networks:
      open5gs:
        aliases:
          - upf1.open5gs.org
    configs:
      - source: upf1_config
        target: /etc/open5gs/custom/upf1.yaml
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ../logs:/var/log/open5gs

  upf2:
    container_name: upf2
    image: "ghcr.io/borjis131/upf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/upf2.yaml"
    networks:
      open5gs:
        aliases:
          - upf2.open5gs.org
    configs:
      - source: upf2_config
        target: /etc/open5gs/custom/upf2.yaml
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ../logs:/var/log/open5gs

  upf3:
    container_name: upf3
    image: "ghcr.io/borjis131/upf:${OPEN5GS_VERSION}"
    command: "-c /etc/open5gs/custom/upf3.yaml"
    networks:
      open5gs:
        aliases:
          - upf3.open5gs.org
    configs:
      - source: upf3_config
        target: /etc/open5gs/custom/upf3.yaml
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ../logs:/var/log/open5gs

