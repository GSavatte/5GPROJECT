services:
  ue1:
    container_name: ue1
    image: "ghcr.io/borjis131/ue:v3.2.7"
    command: "-c /UERANSIM/config/ue1.yaml"
    networks:
      open5gs:
        aliases:
          - ue1.ueransim.org
    configs:
      - source: ue1_config
        target: /UERANSIM/config/ue1.yaml
    privileged: true
    cap_add:
      - NET_ADMIN

