services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../config-files/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - oepn5gs_ext
      - monitoring_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - oepn5gs_ext
      - monitoring_net
    volumes:
      - grafana_data:/var/lib/grafana
      - ../utils/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../utils/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
  
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /sys:/host/sys:ro
    command:
      - '--path.sysfs=/host/sys'
    networks:
      - monitoring_net

networks:
  oepn5gs_ext:
    external: true
    name: open5gs
  monitoring_net:
    driver: bridge
    
volumes:
  prometheus_data:
  grafana_data: