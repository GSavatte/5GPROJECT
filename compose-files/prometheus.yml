global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: 'open5gs-amf'
    static_configs:
      - targets: ['amf:9090']
  - job_name: 'open5gs-pcf'
    static_configs:
      - targets: ['pcf:9090']
  - job_name: 'open5gs-smf1'
    static_configs:
      - targets: ['smf1:9090']
  - job_name: 'open5gs-smf2'
    static_configs:
      - targets: ['smf2:9090']
  - job_name: 'open5gs-smf3'
    static_configs:
      - targets: ['smf3:9090']
  - job_name: 'open5gs-upf1'
    static_configs:
      - targets: ['upf1:9090']
  - job_name: 'open5gs-upf2'
    static_configs:
      - targets: ['upf2:9090']
  - job_name: 'open5gs-upf3'
    static_configs:
      - targets: ['upf3:9090']
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
